<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Calculus Study Hub</title>
<head>
    <meta charset="UTF-8">
    <title>Calculator Quiz</title>
    <style>
        /* Base styling for options before they are clicked */
        .option-btn {
            background-color: #f0f2f5;    
            color: #333333;               
            border: 1px solid #cccccc;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        /* Hover effect for unselected choices */
        .option-btn:hover:not(:disabled) {
            background-color: #e2e4e7;
        }

        /* Disabled styling once answered */
        .option-btn:disabled {
            cursor: default;
        }

        /* Color Palette: Correct Answer */
        .option-btn.correct {
            background-color: #2ecc71 !important; 
            color: #ffffff !important;
            border-color: #2ecc71 !important;
        }

        /* Color Palette: Wrong Answer */
        .option-btn.wrong {
            background-color: #e74c3c !important; 
            color: #ffffff !important;
            border-color: #e74c3c !important;
        }

        /* Feedback message color states */
        .feedback-msg {
            font-weight: bold;
            margin: 10px 0;
        }
        .feedback-correct {
            color: #2ecc71;
        }
        .feedback-wrong {
            color: #e74c3c;
        }
    </style>
</head>
</style>
</head>
<body>

<div class="container">
    <a href="index.html" style="text-decoration: none; color: #3498db; font-weight: bold; font-size: 14px;">← Back to Portal</a>
    <h1>AP Calculus Practice</h1>
    
    <div class="tracker">
        <span>Correct: <span id="correctCounter" class="correct-count">0</span></span>
        <span>Incorrect: <span id="incorrectCounter" class="incorrect-count">0</span></span>
    </div>

    <div class="controls">
        <select id="subjectDropdown"></select>
        <select id="unitDropdown"></select>
        <button id="submitButton">Start Studying</button>
    </div>

    <div class="card">
        <div id="typeOutput">Problem Type</div>
        <div id="questionOutput">Pick an AP unit above, then click Start Studying!</div>
        
        <div class="options-container" id="optionsContainer"></div>

        <div id="feedbackOutput"></div>
        <div id="explanationOutput"></div>
    </div>

    <div class="nav-buttons">
        <button id="leftButton" class="secondary-btn">◀ Prev</button>
        <span id="progressLabel"></span>
        <button id="rightButton" class="secondary-btn">Next ▶</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
