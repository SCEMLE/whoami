<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Calculus Study Hub</title>
    <style>
        body {
            /* Applied the modern font stack and the Lilac Ash background */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #B4A6AB; 
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(97, 80, 85, 0.15);
        }
        h1 { 
            text-align: center; 
            color: #615055; /* Taupe Grey */
            margin-top: 10px; 
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        .tracker {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid #dcdde1;
        }
        .correct-count { color: #2ecc71; }
        .incorrect-count { color: #e74c3c; }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        select, button {
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }
        select {
            background-color: #fff;
            border: 2px solid #CDD5D1;
            font-weight: 500;
            color: #615055;
        }
        #submitButton {
            background-color: #946E83; /* Dusty Mauve for actions */
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: background-color 0.2s;
        }
        #submitButton:hover { background-color: #615055; }
        .card {
            background: #fdfefe;
            border: 4px solid #946E83; /* Thick Dusty Mauve Outline */
            padding: 25px;
            border-radius: 12px;
            min-height: 160px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(97, 80, 85, 0.05);
        }
        #typeOutput {
            font-size: 11px;
            text-transform: uppercase;
            color: #946E83;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-weight: 800;
        }
        #questionOutput { 
            font-size: 18px; 
            line-height: 1.6; 
            font-weight: 700; 
            margin-bottom: 15px; 
            color: #615055;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .option-btn {
            background-color: #f8f9fa;
            color: #615055;
            border: 2px solid #CDD5D1;
            text-align: left;
            padding: 12px 15px;
            font-weight: 600;
            transition: all 0.15s ease;
            border-radius: 8px;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #f1f2f6;
            border-color: #946E83;
        }
        .option-btn.correct {
            background-color: #2ecc71 !important;
            color: white !important;
            border-color: #2ecc71 !important;
        }
        .option-btn.incorrect {
            background-color: #e74c3c !important;
            color: white !important;
            border-color: #e74c3c !important;
        }
        #feedbackOutput { margin-top: 15px; font-weight: 700; font-size: 16px; }
        #explanationOutput {
            margin-top: 15px;
            padding: 14px;
            background-color: #FAF3DD; /* Using the quiet accent shade for popups */
            border-left: 4px solid #946E83;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            line-height: 1.5;
            color: #615055;
            display: none;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .secondary-btn { 
            background-color: #CDD5D1; 
            color: #615055;
            width: auto; 
            min-width: 90px; 
            border: none;
            font-weight: 700;
        }
        .secondary-btn:hover { 
            background-color: #946E83; 
            color: white;
        }
        #progressLabel { font-weight: 700; color: #615055; font-size: 14px; }
        
        .music-wrapper {
            margin-top: 20px;
            border-top: 2px dashed #CDD5D1;
            padding-top: 20px;
            overflow: hidden; 
            height: 60px; 
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="text-decoration: none; color: #946E83; font-weight: 700; font-size: 14px;">← Back to Portal</a>
    <h1>AP Calculus Practice</h1>
    
    <div class="tracker">
        <span>Correct: <span id="correctCounter" class="correct-count">0</span></span>
        <span>Incorrect: <span id="incorrectCounter" class="incorrect-count">0</span></span>
    </div>

    <div class="controls">
        <select id="subjectDropdown"></select>
        <select id="unitDropdown"></select>
        <button id="submitButton">Start Studying</button>
    </div>

    <div class="card">
        <div id="typeOutput">Problem Type</div>
        <div id="questionOutput">Pick an AP unit above, then click Start Studying!</div>
        
        <div class="options-container" id="optionsContainer"></div>

        <div id="feedbackOutput"></div>
        <div id="explanationOutput"></div>
    </div>

    <div class="nav-buttons">
        <button id="leftButton" class="secondary-btn">◀ Prev</button>
        <span id="progressLabel"></span>
        <button id="rightButton" class="secondary-btn">Next ▶</button>
    </div>

    <div class="music-wrapper">
        <iframe width="100%" height="60" src="https://www.youtube.com/embed/9kzE8isXlQY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="margin-top: -1px;"></iframe>
    </div>
</div>

<script src="calcab.js"></script>
</body>
</html>
