<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Calculus Study Hub</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            
            /* Interactive Button Palette */
            --btn-default-bg: #f1f5f9;
            --btn-default-text: #334155;
            --btn-default-hover: #e2e8f0;
            
            --palette-correct: #10b981;   /* Emerald Green */
            --palette-wrong: #ef4444;     /* Vibrant Coral Red */
            --palette-info: #3b82f6;      /* Accent Blue Theme */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Layout Structure */
        .sidebar {
            width: 260px;
            background-color: #0f172a;
            color: #ffffff;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            font-size: 1.25rem;
            margin-bottom: 40px;
            color: var(--palette-info);
            letter-spacing: 0.5px;
        }

        .sidebar a {
            display: block;
            color: #94a3b8;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .sidebar a.active, .sidebar a:hover {
            background-color: #1e293b;
            color: #ffffff;
        }

        /* Main Workspace Container */
        .main-content {
            flex: 1;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .back-link {
            text-decoration: none;
            color: var(--palette-info);
            font-weight: bold;
            font-size: 14px;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #2563eb;
        }

        h1 {
            margin: 0;
            font-size: 1.85rem;
            font-weight: 700;
        }

        /* Tracker Stats styling */
        .tracker {
            display: flex;
            gap: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }
        .correct-count { color: var(--palette-correct); }
        .incorrect-count { color: var(--palette-wrong); }

        /* Filter Controls */
        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .controls select {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            font-size: 0.9rem;
            color: var(--text-main);
            outline: none;
        }

        .controls button {
            background-color: var(--palette-info);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .controls button:hover { background-color: #2563eb; }

        /* Question Panel Card */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        #typeOutput {
