<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Calculus Study Hub</title>

        h1 { text-align: center; color: #2c3e50; margin-top: 10px; }
        .tracker {

            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;

        .correct-count { color: #2ecc71; }

            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }

            padding: 25px;
            border-radius: 8px;
            min-height: 160px;
            margin-bottom: 25px;
        }
        #typeOutput {

            text-transform: uppercase;
            color: #7f8c8d;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        #questionOutput { font-size: 17px; line-height: 1.6; font-weight: 500; margin-bottom: 15px; }

            gap: 10px;
            margin-top: 15px;

            text-align: left;
            padding: 12px 15px;
            font-weight: normal;
            transition: all 0.15s ease;
        }

            border-color: #3498db;
        }

            border-color: #2ecc71;
