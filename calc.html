<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Calculus Study Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: #2c3e50; margin-top: 10px; }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        select, button {
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        .card {
            background: #fdfefe;
            border: 2px solid #eaecee;
            padding: 25px;
            border-radius: 8px;
            min-height: 160px;
            margin-bottom: 25px;
            position: relative;
        }
        #typeOutput {
            font-size: 11px;
            text-transform: uppercase;
            color: #7f8c8d;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        #questionOutput { font-size: 17px; line-height: 1.6; font-weight: 500; }
        #answerOutput {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px dashed #ddd;
            color: #27ae60;
            font-weight: 600;
            font-size: 16px;
            line-height: 1.5;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .secondary-btn { background-color: #95a5a6; width: auto; min-width: 90px; }
        .secondary-btn:hover { background-color: #7f8c8d; }
        .action-btn { background-color: #2ecc71; width: auto; flex-grow: 1; }
        .action-btn:hover { background-color: #27ae60; }
        #progressLabel { font-weight: bold; color: #7f8c8d; font-size: 14px; min-width: 60px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="text-decoration: none; color: #3498db; font-weight: bold; font-size: 14px;">← Back to Portal</a>
    <h1>AP Calculus Practice</h1>
    
    <div class="controls">
        <select id="subjectDropdown"></select>
        <select id="unitDropdown"></select>
        <button id="submitButton">Start Studying</button>
    </div>

    <div class="card">
        <div id="typeOutput">Problem Type</div>
        <div id="questionOutput">Pick an AP unit above, then click Start Studying!</div>
        <div id="answerOutput"></div>
    </div>

    <div class="nav-buttons">
        <button id="leftButton" class="secondary-btn">◀ Prev</button>
        <button id="showAnswerButton" class="action-btn" style="display: none;">Show Answer</button>
        <span id="progressLabel"></span>
        <button id="rightButton" class="secondary-btn">Next ▶</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
