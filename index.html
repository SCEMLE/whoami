<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Study Hub Portal</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #DDF8E8; /* Honeydew Background */
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        h1 { 
            color: #615055; /* Main Title in Taupe Grey */
            font-size: 38px;
            font-weight: 900; 
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        p { 
            color: #615055; /* Subtitle in Taupe Grey with slight opacity */
            font-size: 18px; 
            margin-bottom: 40px;
            opacity: 0.8;
            font-weight: 500;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 800px;
            width: 100%;
        }
        .subject-card {
            background: white;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(97, 80, 85, 0.06);
            text-decoration: none;
            color: inherit;
            text-align: center;
            border: 4px solid #946E83; /* Thick Dusty Mauve Outline */
            transition: all 0.2s ease-in-out;
        }
        .subject-card:hover {
            transform: translateY(-6px);
            border-color: #615055; /* Shifts to Taupe Grey on hover */
            box-shadow: 0 8px 20px rgba(97, 80, 85, 0.12);
        }
        .subject-card h2 { 
            color: #615055; /* Card Header in Taupe Grey */
            margin: 0 0 15px 0; 
            font-size: 26px; 
            font-weight: 800; 
            letter-spacing: -0.5px;
        }
        .subject-card span { 
            color: white; 
            background-color: #946E83; /* Pill Background in Dusty Mauve */
            font-weight: 700; 
            font-size: 14px;
            padding: 8px 18px;
            border-radius: 20px;
            display: inline-block;
            transition: background-color 0.2s;
            letter-spacing: 0.3px;
        }
        .subject-card:hover span {
            background-color: #615055; /* Pill turns Taupe Grey on hover */
        }
        .disabled-card {
            background: rgba(255, 255, 255, 0.4);
            border: 4px dashed #CDD5D1; /* Dust Grey for disabled states */
            box-shadow: none;
            cursor: not-allowed;
        }
        .disabled-card h2 {
            color: #B4A6AB; /* Lilac Ash text for disabled content */
        }
        .disabled-card span {
            color: white;
            background: #CDD5D1;
        }
    </style>
</head>
<body>

    <h1>Welcome to the AP Study Hub</h1>
    <p>Select a subject dashboard below to begin practicing</p>

    <div class="grid">
        <a href="calc.html" class="subject-card">
            <h2>AP Calculus AB</h2>
            <span>8 Units • 240 Questions →</span>
        </a>

        <div class="subject-card disabled-card">
            <h2>AP US History</h2>
            <span>Coming Soon...</span>
        </div>
    </div>

</body>
</html>
