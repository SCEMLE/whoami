<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Study Hub Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0F4C5C; /* Deep Dark Teal Background */
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { 
            color: #FB8B24; /* Title in Princeton Orange */
            font-size: 36px;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        p { 
            color: #FAF3DD; /* Clean off-white so the subtitle reads easily over dark teal */
            font-size: 18px; 
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 800px;
            width: 100%;
        }
        .subject-card {
            background: white;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            text-decoration: none;
            color: inherit;
            text-align: center;
            /* Thicker 4px Outline using Autumn Leaf */
            border: 4px solid #E36414; 
            transition: all 0.2s ease-in-out;
        }
        .subject-card:hover {
            transform: translateY(-6px);
            /* Border turns to electric Princeton Orange on hover */
            border-color: #FB8B24; 
            box-shadow: 0 10px 20px rgba(251, 139, 36, 0.3);
        }
        .subject-card h2 { 
            color: #5F0F40; /* Card text in Crimson Violet */
            margin: 0 0 15px 0; 
            font-size: 24px; 
            font-weight: 800;
        }
        .subject-card span { 
            color: white; 
            background-color: #E36414; /* Action badge in Autumn Leaf */
            font-weight: bold; 
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            transition: background-color 0.2s;
        }
        .subject-card:hover span {
            background-color: #FB8B24; /* Badge shifts to Orange alongside the border */
        }
        .disabled-card {
            background: rgba(255, 255, 255, 0.15);
            border: 4px dashed rgba(255, 255, 255, 0.3);
            box-shadow: none;
            cursor: not-allowed;
        }
        .disabled-card h2 {
            color: rgba(255, 255, 255, 0.4);
        }
        .disabled-card span {
            color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <h1>Welcome to the AP Study Hub</h1>
    <p>Select a subject dashboard below to begin practicing</p>

    <div class="grid">
        <a href="calc.html" class="subject-card">
            <h2>AP Calculus AB</h2>
            <span>8 Units • 240 Questions →</span>
        </a>

        <div class="subject-card disabled-card">
            <h2>AP US History</h2>
            <span>Coming Soon...</span>
        </div>
    </div>

</body>
</html>
