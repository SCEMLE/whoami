<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Study Hub Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #FAF3DD; /* Eggshell Background */
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { 
            color: #68B0AB; /* Main Title in Tropical Teal */
            font-size: 32px;
            margin-bottom: 8px; 
        }
        p { 
            color: #696D7D; /* Subtitle in Blue Slate */
            font-size: 16px; 
            margin-bottom: 40px;
            font-weight: 500;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 800px;
            width: 100%;
        }
        .subject-card {
            background: white;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(105, 109, 125, 0.05);
            text-decoration: none;
            color: inherit;
            text-align: center;
            border: 2px solid #C8D5B9; /* Tea Green Frame */
            transition: all 0.25s ease-in-out;
        }
        .subject-card:hover {
            transform: translateY(-4px);
            border-color: #68B0AB; /* Changes to Tropical Teal on hover */
            box-shadow: 0 8px 16px rgba(104, 176, 171, 0.15);
        }
        .subject-card h2 { 
            color: #696D7D; /* Blue Slate Card Title */
            margin: 0 0 12px 0; 
            font-size: 22px; 
        }
        .subject-card span { 
            color: #68B0AB; /* Tropical Teal Button Text */
            font-weight: bold; 
            font-size: 14px;
            background-color: rgba(104, 176, 171, 0.1); /* Subtle Teal pill background */
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
        }
        .disabled-card {
            background: #fdfdfd;
            border: 2px dashed #e2e2e2;
            opacity: 0.6;
            cursor: not-allowed;
        }
        .disabled-card h2 {
            color: #95a5a6;
        }
        .disabled-card span {
            color: #95a5a6;
            background: #f1f2f6;
        }
    </style>
</head>
<body>

    <h1>Welcome to the AP Study Hub</h1>
    <p>Select a subject dashboard below to begin practicing</p>

    <div class="grid">
        <a href="calc.html" class="subject-card">
            <h2>AP Calculus AB</h2>
            <span>8 Units • 240 Questions →</span>
        </a>

        <div class="subject-card disabled-card">
            <h2>AP US History</h2>
            <span>Coming Soon...</span>
        </div>
    </div>

</body>
</html>
