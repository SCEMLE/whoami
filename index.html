<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Study Hub Portal</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #B4A6AB; 
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        .header-profile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #615055;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            max-width: 760px;
            width: 100%;
            margin-bottom: 20px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid white;
            display: none;
        }
        .header-profile button {
            background: #946E83;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
        }
        .header-profile button:hover {
            background: #FAF3DD;
            color: #615055;
        }
        h1 { 
            color: #615055; 
            font-size: 38px;
            font-weight: 900; 
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .subtitle { 
            color: #615055; 
            font-size: 18px; 
            margin-bottom: 30px;
            opacity: 0.9;
            font-weight: 500;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 800px;
            width: 100%;
            margin-bottom: 40px;
        }
        .subject-card {
            background: white;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(97, 80, 85, 0.1);
            text-decoration: none;
            color: inherit;
            text-align: center;
            border: 4px solid #946E83; 
            transition: all 0.2s ease-in-out;
        }
        .subject-card:hover {
            transform: translateY(-6px);
            border-color: #615055; 
            box-shadow: 0 10px 22px rgba(97, 80, 85, 0.18);
        }
        .subject-card h2 { 
            color: #615055; 
            margin: 0 0 15px 0; 
            font-size: 26px; 
            font-weight: 800; 
        }
        .subject-card span { 
            color: white; 
            background-color: #946E83; 
            font-weight: 700; 
            font-size: 14px;
            padding: 8px 18px;
            border-radius: 20px;
            display: inline-block;
        }
        .subject-card:hover span {
            background-color: #615055; 
        }

        /* Review Hub Section UI */
        .review-toggle-btn {
            background-color: #615055;
            color: white;
            font-weight: 700;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        .review-toggle-btn:hover {
            background-color: #946E83;
        }
        .global-review-panel {
            background: white;
            border: 4px solid #946E83;
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            padding: 25px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: none;
        }
        .subject-review-section {
            margin-bottom: 20px;
        }
        .subject-review-section h3 {
            color: #615055;
            border-bottom: 2px dashed #946E83;
            padding-bottom: 5px;
            margin-bottom: 10px;
            font-size: 20px;
        }
        .missed-item {
            background: #FAF3DD;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 4px solid #e74c3c;
        }
    </style>
</head>
<body>

    <div class="header-profile">
        <div class="profile-info">
            <img id="userAvatar" class="profile-img" src="" alt="Avatar">
            <span>Student: <span id="usernameDisplay">Guest</span></span>
        </div>
        <span>🔥 Streak: <span id="streakDisplay">0</span> Days</span>
        
        <div id="googleBtnWrapper"></div>
        <button id="logoutBtn" style="display: none;">Logout</button>
    </div>

    <h1>Welcome to the AP Study Hub</h1>
    <p class="subtitle">Select a subject dashboard below to begin practicing</p>

    <div class="grid">
        <a href="calc.html" class="subject-card">
            <h2>AP Calculus AB</h2>
            <span>8 Units • 240 Questions →</span>
        </a>

        <a href="apush.html" class="subject-card">
            <h2>AP US History</h2>
            <span>9 Periods • Review Now →</span>
        </a>
    </div>

    <button id="toggleReviewHub" class="review-toggle-btn">📋 View Missed Questions Dashboard</button>

    <div id="globalReviewPanel" class="global-review-panel">
        <h2 style="color: #615055; margin-top: 0;">Incorrect Answers Log</h2>
        <div id="reviewLogsContainer"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
