<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Study Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: #2c3e50; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        select { flex: 1; }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        .card {
            background: #fdfefe;
            border: 2px solid #eaecee;
            padding: 20px;
            border-radius: 8px;
            min-height: 150px;
            margin-bottom: 20px;
            position: relative;
        }
        #typeOutput {
            font-size: 12px;
            text-transform: uppercase;
            color: #7f8c8d;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        #questionOutput { font-size: 18px; line-height: 1.5; }
        #answerOutput {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
            color: #27ae60;
            font-weight: 500;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .secondary-btn { background-color: #95a5a6; }
        .secondary-btn:hover { background-color: #7f8c8d; }
        .action-btn { background-color: #2ecc71; }
        .action-btn:hover { background-color: #27ae60; }
        #progressLabel { font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>AP Study Hub</h1>
    
    <div class="controls">
        <select id="subjectDropdown">
            <option value="AP Calculus AB">AP Calculus AB</option>
            <option value="AP US History">AP US History</option>
        </select>
        
        <select id="unitDropdown">
            <option value="1">Unit 1</option>
            <option value="2">Unit 2</option>
            <option value="3">Unit 3</option>
        </select>
        
        <button id="submitButton">Study</button>
    </div>

    <div class="card">
        <div id="typeOutput">Get Started</div>
        <div id="questionOutput">Pick a subject and unit above, then click Study!</div>
        <div id="answerOutput"></div>
    </div>

    <div class="nav-buttons">
        <button id="leftButton" class="secondary-btn">◀ Prev</button>
        <button id="showAnswerButton" class="action-btn" style="display: none;">Show Answer</button>
        <span id="progressLabel"></span>
        <button id="rightButton" class="secondary-btn">Next ▶</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
<script src="script.js"></script>
